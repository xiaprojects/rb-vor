# The kernel DVB-T driver claims RTL2832U dongles on sight, and rtl-sdr then
# cannot open them. Installed by install.sh to
# /etc/modprobe.d/rb-vor-blacklist.conf
#
# Symptom if this is missing: "usb_claim_interface error -6" and a device that
# works after a manual `rmmod dvb_usb_rtl28xxu` and breaks again on reboot.
blacklist dvb_usb_rtl28xxu
blacklist rtl2832
blacklist rtl2830
blacklist dvb_core
